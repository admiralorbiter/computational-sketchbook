<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kansas City Data Platform - Analysis View</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='analysis.css') }}">
</head>
<body>
    <div id="app">
        <!-- Header with Navigation Tabs -->
        <header class="header">
            <h1>Kansas City Data Platform</h1>
            <nav class="view-tabs">
                <a href="/" class="nav-tab">Map View</a>
                <a href="/analysis" class="nav-tab active">Analysis View</a>
            </nav>
        </header>

        <!-- Split Layout: Map + Analysis Panel -->
        <div class="analysis-container">
            <!-- Left: Map -->
            <div class="analysis-map-container">
                <div id="map"></div>
            </div>
            
            <!-- Right: Analysis Panel -->
            <div class="analysis-panel" id="analysis-panel">
                <div class="panel-header">
                    <h2>Block Group Analysis</h2>
                    <p class="panel-subtitle">Click on a block group to view detailed statistics</p>
                </div>
                
                <div class="panel-content" id="panel-content">
                    <div class="empty-state">
                        <i class="fas fa-mouse-pointer fa-3x"></i>
                        <p>Select a block group on the map to begin</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='analysis.js') }}"></script>
</body>
</html>
