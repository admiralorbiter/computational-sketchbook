{% extends "base.html" %}
{% block content %}
<div x-data="inventoryPage()">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2>Inventory</h2>
    <div>
      <a href="/home/export/inventory" class="btn btn-sm btn-outline-success me-2">
        <i class="bi bi-download"></i> Export CSV
      </a>
      <button @click="showAdd = true" class="btn btn-primary">Add Item</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-4">
          <label class="form-label">Location</label>
          <select class="form-select" x-model="filters.location_id">
            <option value="">All Locations</option>
            <template x-for="location in locations" :key="location.id">
              <option :value="location.id" x-text="location.name"></option>
            </template>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Category</label>
          <select class="form-select" x-model="filters.category">
            <option value="">All Categories</option>
            <option value="cleaning">Cleaning Supplies</option>
            <option value="tools">Tools</option>
            <option value="paint">Paint & Hardware</option>
            <option value="garden">Garden & Outdoor</option>
            <option value="kitchen">Kitchen Supplies</option>
            <option value="bathroom">Bathroom Supplies</option>
            <option value="office">Office Supplies</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select class="form-select" x-model="filters.status">
            <option value="">All Items</option>
            <option value="low_stock">Low Stock</option>
            <option value="expiring">Expiring Soon</option>
            <option value="normal">Normal</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <template x-if="showAdd">
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title" x-text="editing ? 'Edit Item' : 'Add New Item'"></h6>
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label">Name *</label>
            <input class="form-control" placeholder="e.g., Dish Soap" x-model="form.name" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Category</label>
            <select class="form-select" x-model="form.category">
              <option value="">Select category...</option>
              <option value="cleaning">Cleaning Supplies</option>
              <option value="tools">Tools</option>
              <option value="paint">Paint & Hardware</option>
              <option value="garden">Garden & Outdoor</option>
              <option value="kitchen">Kitchen Supplies</option>
              <option value="bathroom">Bathroom Supplies</option>
              <option value="office">Office Supplies</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Location</label>
            <select class="form-select" x-model="form.location_id">
              <option value="">Select location...</option>
              <template x-for="location in locations" :key="location.id">
                <option :value="location.id" x-text="location.name"></option>
              </template>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Quantity *</label>
            <input class="form-control" type="number" step="0.01" placeholder="1.0" x-model="form.qty" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Unit</label>
            <input class="form-control" placeholder="e.g., bottles, pieces, oz" x-model="form.unit" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Par Level</label>
            <input class="form-control" type="number" step="0.01" placeholder="2.0" x-model="form.par_level" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Expiry Date</label>
            <input class="form-control" type="date" x-model="form.expiry_date" />
          </div>
          <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea class="form-control" rows="2" placeholder="Additional notes..." x-model="form.notes"></textarea>
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-primary btn-sm" @click="editing ? update() : create()" x-text="editing ? 'Update' : 'Create'"></button>
          <button class="btn btn-outline-secondary btn-sm ms-2" @click="reset()">Cancel</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Inventory Grid -->
  <div class="row g-3">
    <template x-for="item in filteredItems" :key="item.id">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm" :class="getStatusClass(item)">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0" x-text="item.name"></h6>
            <div>
              <button class="btn btn-sm btn-outline-primary" @click="edit(item)">Edit</button>
              <button class="btn btn-sm btn-outline-danger" @click="remove(item.id)">Delete</button>
            </div>
          </div>
          <div class="card-body">
            <div class="row g-2 mb-2">
              <div class="col-6">
                <small class="text-muted">Category</small>
                <div x-text="formatCategory(item.category)" class="fw-bold"></div>
              </div>
              <div class="col-6">
                <small class="text-muted">Location</small>
                <div x-text="getLocationName(item.location_id)" class="fw-bold"></div>
              </div>
            </div>
            
            <div class="row g-2 mb-2">
              <div class="col-6">
                <small class="text-muted">Quantity</small>
                <div class="fw-bold">
                  <span x-text="item.qty"></span>
                  <span x-show="item.unit" x-text="' ' + item.unit"></span>
                </div>
              </div>
              <div class="col-6">
                <small class="text-muted">Par Level</small>
                <div x-text="item.par_level || 'N/A'" class="fw-bold"></div>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <small class="text-muted">Expiry</small>
                <div x-text="formatDate(item.expiry_date)" class="fw-bold"></div>
              </div>
              <div class="col-6">
                <small class="text-muted">Status</small>
                <div>
                  <span class="badge" :class="getStatusBadgeClass(item)" x-text="getStatusText(item)"></span>
                </div>
              </div>
            </div>

            <div x-show="item.notes" class="mb-2">
              <small class="text-muted">Notes</small>
              <div x-text="item.notes" class="small"></div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Low Stock Alert -->
  <div x-show="lowStockItems.length > 0" class="alert alert-warning mt-3">
    <h6 class="alert-heading">⚠️ Low Stock Items</h6>
    <div class="row g-2">
      <template x-for="item in lowStockItems" :key="item.id">
        <div class="col-md-6">
          <strong x-text="item.name"></strong> - 
          <span x-text="item.qty"></span>
          <span x-show="item.unit" x-text="' ' + item.unit"></span>
          <span class="text-muted">(Par level: <span x-text="item.par_level"></span>)</span>
        </div>
      </template>
    </div>
  </div>

  <!-- Expiring Items Alert -->
  <div x-show="expiringItems.length > 0" class="alert alert-info mt-3">
    <h6 class="alert-heading">📅 Items Expiring Soon</h6>
    <div class="row g-2">
      <template x-for="item in expiringItems" :key="item.id">
        <div class="col-md-6">
          <strong x-text="item.name"></strong> - 
          <span x-text="formatDate(item.expiry_date)"></span>
        </div>
      </template>
    </div>
  </div>

  <div x-show="filteredItems.length === 0" class="text-center text-muted mt-5">
    <p>No inventory items found. Add your first item to get started.</p>
  </div>
</div>

<script>
function inventoryPage() {
  return {
    items: [],
    locations: [],
    lowStockItems: [],
    expiringItems: [],
    showAdd: false,
    editing: null,
    filters: {
      location_id: '',
      category: '',
      status: ''
    },
    form: {
      name: '',
      category: '',
      location_id: '',
      qty: 1.0,
      unit: '',
      par_level: '',
      expiry_date: '',
      notes: ''
    },

    get filteredItems() {
      let filtered = this.items;
      
      if (this.filters.location_id) {
        filtered = filtered.filter(item => item.location_id == this.filters.location_id);
      }
      
      if (this.filters.category) {
        filtered = filtered.filter(item => item.category === this.filters.category);
      }
      
      if (this.filters.status) {
        switch (this.filters.status) {
          case 'low_stock':
            filtered = filtered.filter(item => item.par_level && item.qty < item.par_level);
            break;
          case 'expiring':
            filtered = filtered.filter(item => item.expiry_date && new Date(item.expiry_date) <= new Date(Date.now() + 30 * 24 * 60 * 60 * 1000));
            break;
          case 'normal':
            filtered = filtered.filter(item => (!item.par_level || item.qty >= item.par_level) && 
                                             (!item.expiry_date || new Date(item.expiry_date) > new Date(Date.now() + 30 * 24 * 60 * 60 * 1000)));
            break;
        }
      }
      
      return filtered;
    },

    async load() {
      try {
        const [itemsRes, locationsRes, lowStockRes, expiringRes] = await Promise.all([
          fetch('/home/inventory/items'),
          fetch('/home/locations'),
          fetch('/home/inventory/low-stock'),
          fetch('/home/inventory/expiring')
        ]);
        this.items = await itemsRes.json();
        this.locations = await locationsRes.json();
        this.lowStockItems = await lowStockRes.json();
        this.expiringItems = await expiringRes.json();
      } catch (e) {
        console.error('Error loading inventory:', e);
      }
    },

    async create() {
      try {
        const response = await fetch('/home/inventory/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(this.form)
        });
        if (response.ok) {
          await this.load();
          this.reset();
          this.showAdd = false;
        }
      } catch (e) {
        console.error('Error creating item:', e);
      }
    },

    edit(item) {
      this.editing = item;
      this.form = { ...item };
      this.showAdd = true;
    },

    async update() {
      try {
        const response = await fetch(`/home/inventory/items/${this.editing.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(this.form)
        });
        if (response.ok) {
          await this.load();
          this.reset();
          this.showAdd = false;
          this.editing = null;
        }
      } catch (e) {
        console.error('Error updating item:', e);
      }
    },

    async remove(id) {
      if (!confirm('Are you sure you want to delete this inventory item?')) return;
      
      try {
        const response = await fetch(`/home/inventory/items/${id}`, {
          method: 'DELETE'
        });
        if (response.ok) {
          await this.load();
        }
      } catch (e) {
        console.error('Error deleting item:', e);
      }
    },

    reset() {
      this.form = {
        name: '',
        category: '',
        location_id: '',
        qty: 1.0,
        unit: '',
        par_level: '',
        expiry_date: '',
        notes: ''
      };
      this.editing = null;
    },

    getLocationName(locationId) {
      if (!locationId) return 'N/A';
      const location = this.locations.find(l => l.id === locationId);
      return location ? location.name : 'Unknown';
    },

    formatCategory(category) {
      const categories = {
        'cleaning': '🧽 Cleaning',
        'tools': '🔧 Tools',
        'paint': '🎨 Paint & Hardware',
        'garden': '🌱 Garden & Outdoor',
        'kitchen': '🍳 Kitchen',
        'bathroom': '🚿 Bathroom',
        'office': '📁 Office',
        'other': '📦 Other'
      };
      return categories[category] || category || 'N/A';
    },

    formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      return new Date(dateStr).toLocaleDateString();
    },

    getStatusClass(item) {
      if (item.par_level && item.qty < item.par_level) {
        return 'border-warning';
      }
      if (item.expiry_date && new Date(item.expiry_date) <= new Date(Date.now() + 30 * 24 * 60 * 60 * 1000)) {
        return 'border-info';
      }
      return '';
    },

    getStatusText(item) {
      if (item.par_level && item.qty < item.par_level) {
        return 'Low Stock';
      }
      if (item.expiry_date && new Date(item.expiry_date) <= new Date(Date.now() + 30 * 24 * 60 * 60 * 1000)) {
        return 'Expiring Soon';
      }
      return 'Normal';
    },

    getStatusBadgeClass(item) {
      if (item.par_level && item.qty < item.par_level) {
        return 'bg-warning text-dark';
      }
      if (item.expiry_date && new Date(item.expiry_date) <= new Date(Date.now() + 30 * 24 * 60 * 60 * 1000)) {
        return 'bg-info text-dark';
      }
      return 'bg-success';
    },

    init() {
      this.load();
    }
  }
}
</script>
{% endblock %}
