{% extends "base.html" %}
{% block content %}
<div x-data="choresPage()">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Chore Plans</h3>
    <button class="btn btn-primary btn-sm" @click="showAdd=true">Add Chore</button>
  </div>

  <template x-if="showAdd">
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title" x-text="editing ? 'Edit Chore Plan' : 'Add New Chore Plan'"></h6>
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label">Title *</label>
            <input class="form-control" placeholder="e.g., Clean Kitchen" x-model="form.title" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Location (Optional)</label>
            <select class="form-select" x-model="form.location_id">
              <option value="">No specific location</option>
              <template x-for="loc in locations" :key="loc.id">
                <option :value="loc.id" x-text="loc.name"></option>
              </template>
            </select>
          </div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-md-6">
            <label class="form-label">Cadence *</label>
            <select class="form-select" x-model="form.cadence">
              <option value="RRULE:FREQ=WEEKLY">Weekly</option>
              <option value="RRULE:FREQ=WEEKLY;INTERVAL=2">Every 2 weeks</option>
              <option value="RRULE:FREQ=MONTHLY">Monthly</option>
              <option value="RRULE:FREQ=MONTHLY;INTERVAL=2">Every 2 months</option>
              <option value="RRULE:FREQ=YEARLY">Yearly</option>
              <option value="CUSTOM">Custom (enter below)</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Custom Cadence</label>
            <input class="form-control" placeholder="e.g., RRULE:FREQ=WEEKLY;BYDAY=1SU" 
                   x-model="form.custom_cadence" 
                   :disabled="form.cadence !== 'CUSTOM'" />
          </div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-md-6">
            <label class="form-label">Next Due Date</label>
            <input class="form-control" type="date" x-model="form.next_due" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Last Done Date</label>
            <input class="form-control" type="date" x-model="form.last_done" />
          </div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-12">
            <label class="form-label">Checklist (Optional)</label>
            <textarea class="form-control" rows="3" 
                      placeholder="Enter checklist items, one per line..." 
                      x-model="form.checklist_text"></textarea>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-success btn-sm" @click="editing ? update() : create()" :disabled="!form.title">
            <span x-text="editing ? 'Update Chore' : 'Save Chore'"></span>
          </button>
          <button class="btn btn-outline-secondary btn-sm" @click="reset()">Cancel</button>
        </div>
      </div>
    </div>
  </template>

  <div class="table-responsive">
    <table class="table table-sm align-middle">
      <thead>
        <tr>
          <th>Title</th>
          <th>Location</th>
          <th>Cadence</th>
          <th>Next Due</th>
          <th>Last Done</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="p in plans" :key="p.id">
          <tr :class="getStatusClass(p)">
            <td><strong x-text="p.title"></strong></td>
            <td x-text="getLocationName(p.location_id)"></td>
            <td x-text="formatCadence(p.cadence)"></td>
            <td x-text="formatDate(p.next_due)"></td>
            <td x-text="formatDate(p.last_done)"></td>
            <td>
              <span class="badge" :class="getStatusBadgeClass(p)" x-text="getStatusText(p)"></span>
            </td>
            <td>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-success" @click="logEvent(p.id)" title="Log Completion">
                  <i class="bi bi-check-circle"></i>
                </button>
                <button class="btn btn-outline-primary" @click="edit(p)" title="Edit">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-outline-danger" @click="remove(p.id)" title="Delete">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </template>
        <template x-if="plans.length === 0">
          <tr>
            <td colspan="7" class="text-center text-muted py-4">
              No chore plans found. Click "Add Chore" to get started.
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>

<script>
function choresPage(){
  return {
    plans: [],
    locations: [],
    showAdd: false,
    editing: null,
    form: {
      title: '', 
      location_id: '', 
      cadence: 'RRULE:FREQ=WEEKLY', 
      custom_cadence: '',
      next_due: '', 
      last_done: '', 
      checklist_text: ''
    },
    
    async load(){
      try {
        const [plansRes, locationsRes] = await Promise.all([
          fetch('/home/chores/plans'),
          fetch('/home/locations')
        ]);
        this.plans = await plansRes.json();
        this.locations = await locationsRes.json();
      } catch (e) {
        console.error('Error loading data:', e);
      }
    },
    
    async create(){
      if(!this.form.title) return;
      
      const data = { ...this.form };
      if (this.form.cadence === 'CUSTOM') {
        data.cadence = this.form.custom_cadence;
      }
      if (this.form.checklist_text) {
        data.checklist_json = this.form.checklist_text.split('\n').filter(line => line.trim());
      }
      
      try {
        const r = await fetch('/home/chores/plans', {
          method: 'POST', 
          headers: {'Content-Type': 'application/json'}, 
          body: JSON.stringify(data)
        });
        if(r.ok){ 
          this.reset(); 
          this.load(); 
        } else {
          const error = await r.json();
          alert('Error: ' + (error.error || 'Failed to create chore'));
        }
      } catch (e) {
        console.error('Error creating chore:', e);
        alert('Error creating chore');
      }
    },
    
    edit(plan) {
      this.editing = plan.id;
      this.form = { 
        ...plan,
        checklist_text: plan.checklist_json ? (Array.isArray(plan.checklist_json) ? plan.checklist_json.join('\n') : plan.checklist_json) : '',
        custom_cadence: plan.cadence
      };
      this.showAdd = true;
    },
    
    async update() {
      if(!this.form.title || !this.editing) return;
      
      const data = { ...this.form };
      if (this.form.cadence === 'CUSTOM') {
        data.cadence = this.form.custom_cadence;
      }
      if (this.form.checklist_text) {
        data.checklist_json = this.form.checklist_text.split('\n').filter(line => line.trim());
      }
      
      try {
        const r = await fetch(`/home/chores/plans/${this.editing}`, {
          method: 'PUT', 
          headers: {'Content-Type': 'application/json'}, 
          body: JSON.stringify(data)
        });
        if(r.ok){ 
          this.reset(); 
          this.load(); 
        } else {
          const error = await r.json();
          alert('Error: ' + (error.error || 'Failed to update chore'));
        }
      } catch (e) {
        console.error('Error updating chore:', e);
        alert('Error updating chore');
      }
    },
    
    async remove(id){
      if(!confirm('Are you sure you want to delete this chore plan?')) return;
      
      try {
        const r = await fetch(`/home/chores/plans/${id}`, {method: 'DELETE'});
        if(r.ok){ this.load(); }
      } catch (e) {
        console.error('Error deleting chore:', e);
        alert('Error deleting chore');
      }
    },
    
    async logEvent(id){
      const who = prompt('Who completed this chore? (optional):');
      if (who === null) return; // User cancelled
      
      const notes = prompt('Enter completion notes (optional):');
      if (notes === null) return; // User cancelled
      
      try {
        const r = await fetch(`/home/chores/plans/${id}/events`, {
          method: 'POST', 
          headers: {'Content-Type': 'application/json'}, 
          body: JSON.stringify({
            who: who || 'Unknown',
            notes: notes || 'Completed',
            ts: new Date().toISOString()
          })
        });
        if(r.ok){ this.load(); }
      } catch (e) {
        console.error('Error logging event:', e);
        alert('Error logging event');
      }
    },
    
    reset(){ 
      this.showAdd = false; 
      this.editing = null;
      this.form = {
        title: '', 
        location_id: '', 
        cadence: 'RRULE:FREQ=WEEKLY', 
        custom_cadence: '',
        next_due: '', 
        last_done: '', 
        checklist_text: ''
      }; 
    },
    
    getLocationName(locationId) {
      if (!locationId) return '-';
      const location = this.locations.find(l => l.id === locationId);
      return location ? location.name : '-';
    },
    
    formatCadence(cadence) {
      if (!cadence) return '-';
      const cadenceMap = {
        'RRULE:FREQ=WEEKLY': 'Weekly',
        'RRULE:FREQ=WEEKLY;INTERVAL=2': 'Every 2 weeks',
        'RRULE:FREQ=MONTHLY': 'Monthly',
        'RRULE:FREQ=MONTHLY;INTERVAL=2': 'Every 2 months',
        'RRULE:FREQ=YEARLY': 'Yearly'
      };
      return cadenceMap[cadence] || cadence;
    },
    
    formatDate(dateStr) {
      if (!dateStr) return '-';
      try {
        return new Date(dateStr).toLocaleDateString();
      } catch {
        return dateStr;
      }
    },
    
    getStatusClass(plan) {
      if (!plan.next_due) return '';
      const today = new Date();
      const dueDate = new Date(plan.next_due);
      if (dueDate < today) return 'table-danger';
      if (dueDate.getTime() - today.getTime() < 7 * 24 * 60 * 60 * 1000) return 'table-warning';
      return '';
    },
    
    getStatusText(plan) {
      if (!plan.next_due) return 'No due date';
      const today = new Date();
      const dueDate = new Date(plan.next_due);
      if (dueDate < today) return 'Overdue';
      if (dueDate.getTime() - today.getTime() < 7 * 24 * 60 * 60 * 1000) return 'Due Soon';
      return 'On Track';
    },
    
    getStatusBadgeClass(plan) {
      if (!plan.next_due) return 'bg-secondary';
      const today = new Date();
      const dueDate = new Date(plan.next_due);
      if (dueDate < today) return 'bg-danger';
      if (dueDate.getTime() - today.getTime() < 7 * 24 * 60 * 60 * 1000) return 'bg-warning';
      return 'bg-success';
    },
    
    init(){ this.load(); }
  }
}
</script>
{% endblock %}
