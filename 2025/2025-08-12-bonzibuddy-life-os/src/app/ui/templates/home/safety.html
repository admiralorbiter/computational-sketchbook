{% extends "base.html" %}
{% block content %}
<div x-data="safetyPage()">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Safety Devices</h3>
    <button class="btn btn-primary btn-sm" @click="showAdd=true">Add Device</button>
  </div>

  <template x-if="showAdd">
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title" x-text="editing ? 'Edit Safety Device' : 'Add New Safety Device'"></h6>
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label">Device Type *</label>
            <select class="form-select" x-model="form.type" required>
              <option value="">Select Type</option>
              <option value="smoke">Smoke Detector</option>
              <option value="CO">Carbon Monoxide Detector</option>
              <option value="extinguisher">Fire Extinguisher</option>
              <option value="first_aid">First Aid Kit</option>
              <option value="emergency_light">Emergency Light</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Location (Optional)</label>
            <select class="form-select" x-model="form.location_id">
              <option value="">No specific location</option>
              <template x-for="loc in locations" :key="loc.id">
                <option :value="loc.id" x-text="loc.name"></option>
              </template>
            </select>
          </div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-md-6">
            <label class="form-label">Model</label>
            <input class="form-control" placeholder="e.g., Kidde i12010" x-model="form.model" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Test Cadence *</label>
            <select class="form-select" x-model="form.test_cadence">
              <option value="RRULE:FREQ=MONTHLY">Monthly</option>
              <option value="RRULE:FREQ=MONTHLY;INTERVAL=3">Every 3 months</option>
              <option value="RRULE:FREQ=MONTHLY;INTERVAL=6">Every 6 months</option>
              <option value="RRULE:FREQ=YEARLY">Yearly</option>
              <option value="CUSTOM">Custom (enter below)</option>
            </select>
          </div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-md-6">
            <label class="form-label">Custom Test Cadence</label>
            <input class="form-control" placeholder="e.g., RRULE:FREQ=MONTHLY;BYDAY=1SU" 
                   x-model="form.custom_cadence" 
                   :disabled="form.test_cadence !== 'CUSTOM'" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Purchase Date</label>
            <input class="form-control" type="date" x-model="form.purchase_date" />
          </div>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-md-6">
            <label class="form-label">Expiry Date (if applicable)</label>
            <input class="form-control" type="date" x-model="form.expiry_date" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Next Test Due</label>
            <input class="form-control" type="date" x-model="form.next_test_due" />
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-success btn-sm" @click="editing ? update() : create()" :disabled="!form.type">
            <span x-text="editing ? 'Update Device' : 'Save Device'"></span>
          </button>
          <button class="btn btn-outline-secondary btn-sm" @click="reset()">Cancel</button>
        </div>
      </div>
    </div>
  </template>

  <div class="table-responsive">
    <table class="table table-sm align-middle">
      <thead>
        <tr>
          <th>Type</th>
          <th>Model</th>
          <th>Location</th>
          <th>Test Cadence</th>
          <th>Next Test Due</th>
          <th>Last Test</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="d in devices" :key="d.id">
          <tr :class="getStatusClass(d)">
            <td>
              <span class="badge" :class="getTypeBadgeClass(d.type)" x-text="formatType(d.type)"></span>
            </td>
            <td x-text="d.model || '-'"></td>
            <td x-text="getLocationName(d.location_id)"></td>
            <td x-text="formatCadence(d.test_cadence)"></td>
            <td x-text="formatDate(d.next_test_due)"></td>
            <td x-text="formatDate(d.last_test)"></td>
            <td>
              <span class="badge" :class="getStatusBadgeClass(d)" x-text="getStatusText(d)"></span>
            </td>
            <td>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-success" @click="recordTest(d.id)" title="Record Test">
                  <i class="bi bi-check-circle"></i>
                </button>
                <button class="btn btn-outline-primary" @click="edit(d)" title="Edit">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-outline-danger" @click="remove(d.id)" title="Delete">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </template>
        <template x-if="devices.length === 0">
          <tr>
            <td colspan="8" class="text-center text-muted py-4">
              No safety devices found. Click "Add Device" to get started.
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>

<script>
function safetyPage(){
  return {
    devices: [],
    locations: [],
    showAdd: false,
    editing: null,
    form: {
      type: '', 
      location_id: '', 
      model: '', 
      test_cadence: 'RRULE:FREQ=MONTHLY',
      custom_cadence: '',
      purchase_date: '', 
      expiry_date: '', 
      next_test_due: '', 
      last_test: ''
    },
    
    async load(){
      try {
        const [devicesRes, locationsRes] = await Promise.all([
          fetch('/home/safety/devices'),
          fetch('/home/locations')
        ]);
        this.devices = await devicesRes.json();
        this.locations = await locationsRes.json();
      } catch (e) {
        console.error('Error loading data:', e);
      }
    },
    
    async create(){
      if(!this.form.type) return;
      
      const data = { ...this.form };
      if (this.form.test_cadence === 'CUSTOM') {
        data.test_cadence = this.form.custom_cadence;
      }
      
      try {
        const r = await fetch('/home/safety/devices', {
          method: 'POST', 
          headers: {'Content-Type': 'application/json'}, 
          body: JSON.stringify(data)
        });
        if(r.ok){ 
          this.reset(); 
          this.load(); 
        } else {
          const error = await r.json();
          alert('Error: ' + (error.error || 'Failed to create device'));
        }
      } catch (e) {
        console.error('Error creating device:', e);
        alert('Error creating device');
      }
    },
    
    edit(device) {
      this.editing = device.id;
      this.form = { 
        ...device,
        custom_cadence: device.test_cadence
      };
      this.showAdd = true;
    },
    
    async update() {
      if(!this.form.type || !this.editing) return;
      
      const data = { ...this.form };
      if (this.form.test_cadence === 'CUSTOM') {
        data.test_cadence = this.form.custom_cadence;
      }
      
      try {
        const r = await fetch(`/home/safety/devices/${this.editing}`, {
          method: 'PUT', 
          headers: {'Content-Type': 'application/json'}, 
          body: JSON.stringify(data)
        });
        if(r.ok){ 
          this.reset(); 
          this.load(); 
        } else {
          const error = await r.json();
          alert('Error: ' + (error.error || 'Failed to update device'));
        }
      } catch (e) {
        console.error('Error updating device:', e);
        alert('Error updating device');
      }
    },
    
    async remove(id){
      if(!confirm('Are you sure you want to delete this safety device?')) return;
      
      try {
        const r = await fetch(`/home/safety/devices/${id}`, {method: 'DELETE'});
        if(r.ok){ this.load(); }
      } catch (e) {
        console.error('Error deleting device:', e);
        alert('Error deleting device');
      }
    },
    
    async recordTest(id){
      const testDate = prompt('Enter test date (YYYY-MM-DD) or leave blank for today:');
      if (testDate === null) return; // User cancelled
      
      try {
        const r = await fetch(`/home/safety/devices/${id}/test`, {
          method: 'POST', 
          headers: {'Content-Type': 'application/json'}, 
          body: JSON.stringify({
            test_date: testDate || new Date().toISOString().slice(0, 10)
          })
        });
        if(r.ok){ this.load(); }
      } catch (e) {
        console.error('Error recording test:', e);
        alert('Error recording test');
      }
    },
    
    reset(){ 
      this.showAdd = false; 
      this.editing = null;
      this.form = {
        type: '', 
        location_id: '', 
        model: '', 
        test_cadence: 'RRULE:FREQ=MONTHLY',
        custom_cadence: '',
        purchase_date: '', 
        expiry_date: '', 
        next_test_due: '', 
        last_test: ''
      }; 
    },
    
    getLocationName(locationId) {
      if (!locationId) return '-';
      const location = this.locations.find(l => l.id === locationId);
      return location ? location.name : '-';
    },
    
    formatType(type) {
      if (!type) return '-';
      const typeMap = {
        'smoke': 'Smoke Detector',
        'CO': 'CO Detector',
        'extinguisher': 'Fire Extinguisher',
        'first_aid': 'First Aid Kit',
        'emergency_light': 'Emergency Light',
        'other': 'Other'
      };
      return typeMap[type] || type;
    },
    
    formatCadence(cadence) {
      if (!cadence) return '-';
      const cadenceMap = {
        'RRULE:FREQ=MONTHLY': 'Monthly',
        'RRULE:FREQ=MONTHLY;INTERVAL=3': 'Every 3 months',
        'RRULE:FREQ=MONTHLY;INTERVAL=6': 'Every 6 months',
        'RRULE:FREQ=YEARLY': 'Yearly'
      };
      return cadenceMap[cadence] || cadence;
    },
    
    formatDate(dateStr) {
      if (!dateStr) return '-';
      try {
        return new Date(dateStr).toLocaleDateString();
      } catch {
        return dateStr;
      }
    },
    
    getStatusClass(device) {
      if (!device.next_test_due) return '';
      const today = new Date();
      const dueDate = new Date(device.next_test_due);
      if (dueDate < today) return 'table-danger';
      if (dueDate.getTime() - today.getTime() < 7 * 24 * 60 * 60 * 1000) return 'table-warning';
      return '';
    },
    
    getStatusText(device) {
      if (!device.next_test_due) return 'No due date';
      const today = new Date();
      const dueDate = new Date(device.next_test_due);
      if (dueDate < today) return 'Overdue';
      if (dueDate.getTime() - today.getTime() < 7 * 24 * 60 * 60 * 1000) return 'Due Soon';
      return 'On Track';
    },
    
    getStatusBadgeClass(device) {
      if (!device.next_test_due) return 'bg-secondary';
      const today = new Date();
      const dueDate = new Date(device.next_test_due);
      if (dueDate < today) return 'bg-danger';
      if (dueDate.getTime() - today.getTime() < 7 * 24 * 60 * 60 * 1000) return 'bg-warning';
      return 'bg-success';
    },
    
    getTypeBadgeClass(type) {
      const typeMap = {
        'smoke': 'bg-danger',
        'CO': 'bg-warning',
        'extinguisher': 'bg-danger',
        'first_aid': 'bg-success',
        'emergency_light': 'bg-info',
        'other': 'bg-secondary'
      };
      return typeMap[type] || 'bg-secondary';
    },
    
    init(){ this.load(); }
  }
}
</script>
{% endblock %}
