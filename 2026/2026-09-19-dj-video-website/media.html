  <main id="main-content">
    <header>
      <h1><!-- Media Page Title --></h1>
      <p><!-- Page Subtitle --></p>
      <nav aria-label="Media Section Navigation">
        <ul>
          <li><a href="#videos"><!-- Video Link Label --></a></li>
          <li><a href="#audio"><!-- Audio Link Label --></a></li>
          <li><a href="#photos"><!-- Photos Link Label --></a></li>
        </ul>
      </nav>
    </header>

    <!-- Video Sets Section -->
    <section id="videos">
      <h2><!-- Videos Section Heading --></h2>

      <article>
        <h3><!-- Video Title --></h3>
        <p><time datetime=""></time></p>
        <p><!-- Video Description / Metadata --></p>
        <figure>
          <video controls preload="metadata">
            <source src="" type="video/mp4">
          </video>
          <figcaption><!-- Video Caption --></figcaption>
        </figure>
        <details>
          <summary><!-- Tracklist Toggle Label --></summary>
          <ol>
            <li><!-- Track Item --></li>
          </ol>
        </details>
      </article>
    </section>

    <!-- Audio Mixes Section -->
    <section id="audio">
      <h2><!-- Audio Mixes Heading --></h2>

      <article>
        <h3><!-- Audio Title --></h3>
        <p><time datetime=""></time></p>
        <p><!-- Audio Description / Genre --></p>
        <figure>
          <audio controls preload="none">
            <source src="" type="audio/mpeg">
          </audio>
          <figcaption><!-- Audio Caption --></figcaption>
        </figure>
        <ul>
          <li><a href=""><!-- Streaming Platform Link --></a></li>
        </ul>
      </article>
    </section>

    <!-- Photo Gallery Section -->
    <section id="photos">
      <h2><!-- Gallery Heading --></h2>
      <ul>
        <li>
          <figure>
            <img src="" alt="">
            <figcaption><!-- Photo Caption --></figcaption>
          </figure>
        </li>
      </ul>
    </section>

    <!-- Aside CTA -->
    <aside>
      <h2><!-- CTA Heading --></h2>
      <p><!-- CTA Text --></p>
      <a href="contact.html"><!-- CTA Link --></a>
