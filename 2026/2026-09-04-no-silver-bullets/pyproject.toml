[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nsb"
version = "0.1.0"
description = "No Silver Bullet - Controlled experimental program for integer factorization research"
readme = "README.md"
authors = [{ name = "No Silver Bullet Research Team" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "gmpy2>=2.2.0",
    "python-sat>=1.9.dev15",
    "z3-solver>=5.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
nsb = "nsb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
