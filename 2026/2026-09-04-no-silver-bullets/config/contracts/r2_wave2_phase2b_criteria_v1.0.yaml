# Preregistered Experimental Criteria: NSB-R2-WAVE2-B-PHASE2B
# Version: 1.0 (Phase 2B: Representation-Search & In-House Polyselect Proxy on Fresh Holdout)
# Contract: NSB-R2-WAVE2-B-PHASE2B
# Primary Track: Track B (Algebraic Evolution)
# Execution Phase: phase_2b_search_and_polyselect_proxy
version: "1.0"
contract_id: "NSB-R2-WAVE2-B-PHASE2B"
criteria_tier: "frozen_preregistration_phase_2b"
primary_track: "track_b"
execution_phase: "phase_2b_search_and_polyselect_proxy"

corpus:
  version: "v003_wave2"
  split: "search_holdout"
  family: "R"  # Balanced random semiprimes
  bit_sizes: [32, 48, 64, 80, 96]
  instances_per_size: 30
  total_instances: 150
  master_seed: 20260905  # Fresh master seed distinct from v002
  min_replicated_instances_per_size: 30
  require_independent_moduli: true
  require_pairwise_coprimality: true
  require_all_cohorts_for_canonical: true

# Core Scientific Hypothesis:
# Frozen systematic candidate search (degree-3 translation/rotation grid, budget=50)
# significantly increases relation yield and lifts absolute relation density above the
# measurement floor at >=64 bits compared to canonical base-m degree-3 baseline.

claim_hierarchy:
  # Tier 2: Representation-Search Claim
  # FrozenSearchOptimizer d=3 vs Canonical base-m d=3 across independent moduli
  search_claim:
    enabled: true
    baseline_type: "canonical_base_m_d3"
    candidate_type: "frozen_search_optimized_d3"
    primary_metric: "modulus_paired_yield_diff"
    min_search_yield_gain: 1.15           # At least +15% yield gain over canonical base-m
    max_wilcoxon_pvalue: 0.01
    max_paired_t_pvalue: 0.01
    min_candidate_win_rate: 0.70          # At least 70% of moduli must show positive effect
    require_log_norm_advantage: true
    max_log_norm_ratio: 0.95
    # Absolute Floor Criterion:
    # Requires a minimum fraction of moduli producing >= 1 non-zero relation
    # Prevents artifactual "2 relations vs 0" from claiming astronomical gain in event-starved regimes
    require_absolute_relation_floor: true
    min_moduli_with_relations_ratio: 0.50 # At least 50% of moduli in cohort must produce >= 1 relation
    target_verdict: "SEARCH_ADVANTAGE_CERTIFIED"

  # Tier 3: In-House Polyselect Proxy Claim
  # Frozen search candidate compared against in-house polyselect baseline
  in_house_polyselect_proxy:
    enabled: true
    baseline_type: "in_house_optimized_polyselect_d3"
    candidate_type: "frozen_search_optimized_d3"
    metrics:
      - "murphy_e_score"
      - "cumulative_batch_throughput_per_core_sec"
      - "empirical_yield_rate"
    min_murphy_e_ratio: 1.00
    min_throughput_ratio: 1.00            # Evaluated via cumulative multi-batch timing (>= 0.25s CPU)
    max_wilcoxon_pvalue: 0.01
    forbid_sota_claim: true               # Explicitly prohibited from claiming CADO-NFS SOTA
    target_verdict: "IN_HOUSE_POLYSELECT_PROXY_BEATEN"

timing_methodology:
  type: "cumulative_multi_batch"
  min_cpu_seconds_per_modulus: 0.25       # Eliminates Windows 15.6ms timer tick quantization
  max_batch_repeats: 2000

resource_limits:
  per_modulus_timeout_cpu_seconds: 5.0
  per_cohort_timeout_seconds: 300.0
  max_total_wall_seconds: 1800.0
  max_rss_mb: 2048
  stopping_rules:
    forbid_zero_yield_imputation: true
    forbid_partial_run_canonical: true
