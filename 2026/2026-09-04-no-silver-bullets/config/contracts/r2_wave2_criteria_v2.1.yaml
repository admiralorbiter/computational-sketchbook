# Preregistered Experimental Criteria: NSB-R2-WAVE2-B-CONFIRMATORY
# Version: 2.1 (Amendment 1: Pre-Run Methodological Audit Amendments)
# Contract: NSB-R2-WAVE2-B-CONFIRMATORY
# Focus: Track B Confirmatory Replication & Multi-Tier Claim Verification
version: "2.1"
contract_id: "NSB-R2-WAVE2-B-CONFIRMATORY"
criteria_tier: "frozen_preregistration_amendment_1"
primary_track: "track_b"

corpus:
  version: "v002_wave2"
  split: "confirmatory"
  family: "R"  # Balanced random semiprimes
  bit_sizes: [32, 48, 64, 80, 96]
  instances_per_size: 30
  total_instances: 150
  master_seed: 20260904
  min_replicated_instances_per_size: 30
  require_independent_moduli: true
  require_pairwise_coprimality: true     # Mechanical assert: gcd(Ni, Nj) == 1 for all i != j

# Hierarchy of Claims: Evaluated independently in strict sequence
claim_hierarchy:
  # Tier 1: Replication Claim
  # Canonical base-m degree-3 beats canonical base-m degree-2 across independent moduli
  replication_claim:
    enabled: true
    baseline_type: "canonical_base_m_d2"
    candidate_type: "canonical_base_m_d3"
    primary_metric: "modulus_paired_yield_diff"
    min_mean_paired_yield_diff: 0.0
    min_candidate_win_rate: 0.70          # At least 21 of 30 moduli must show positive effect
    max_wilcoxon_pvalue: 0.01             # Non-parametric paired test (strictly enforced)
    max_paired_t_pvalue: 0.01             # Parametric paired test (strictly enforced)
    min_evaluable_bit_sizes: 1            # Sizes with non-zero yield
    target_verdict: "REPLICATION_CERTIFIED"
    sieve_mcnemar_role: "intra_modulus_diagnostic"  # Diagnostic only, not cross-modulus gate

  # Tier 2: Representation-Search Claim
  # Frozen SearchOptimizer (degree 3 rotation/translation) beats canonical base-m at same degree
  search_claim:
    enabled: true
    baseline_type: "canonical_base_m_d3"
    candidate_type: "frozen_search_optimized_d3"
    primary_metric: "modulus_paired_yield_diff"
    min_search_yield_gain: 1.15           # >= 15% paired yield gain over canonical base-m
    max_wilcoxon_pvalue: 0.01
    require_log_norm_advantage: true
    max_log_norm_ratio: 0.95
    target_verdict: "SEARCH_ADVANTAGE_CERTIFIED"

  # Tier 3: In-House Polyselect Proxy Claim
  # Candidate beats in-house size/root-optimized polynomial selection
  # Explicitly scoped: Beating this proxy DOES NOT certify beating CADO-NFS / SOTA
  in_house_polyselect_proxy:
    enabled: true
    baseline_type: "in_house_optimized_polyselect_d3"
    candidate_type: "frozen_search_optimized_d3"
    metrics:
      - "murphy_e_score"
      - "relation_throughput_per_core_sec"
      - "empirical_yield_rate"
    min_murphy_e_ratio: 1.00              # Must equal or exceed in-house baseline Murphy E
    min_throughput_ratio: 1.00            # Must equal or exceed throughput per core-second
    max_wilcoxon_pvalue: 0.01
    target_verdict: "IN_HOUSE_POLYSELECT_PROXY_BEATEN"
    forbid_sota_claim: true               # Cannot claim SOTA without external CADO-NFS integration

  # Tier 4: Scaling Persistence Claim
  # Empirical yield advantage does not decay across bit lengths (32b -> 96b)
  # Explicitly scoped: Finite bit length range cannot certify asymptotic behavior
  scaling_persistence:
    enabled: true
    primary_metric: "paired_yield_ratio_vs_bits"
    min_evaluable_bit_sizes: 4            # Requires at least 4 of 5 bit sizes evaluable
    min_slope_ci_lower: 0.0               # OLS regression slope 95% CI lower bound must be >= 0.0
    target_verdict: "SCALING_PERSISTENCE_CERTIFIED"

# Search Space & Sieve Parameters
search_space:
  degrees_allowed: [2, 3, 4, 5, 6]
  sieve_bound_a: 100
  sieve_bound_b: 20
  factor_base_primes_bound: 250
  murphy_alpha_primes_bound: 2000
  search_budget_per_modulus: 50

# Compute Limits & Stopping Rules
resource_limits:
  per_modulus_timeout_seconds: 5.0
  per_cohort_timeout_seconds: 300.0
  max_total_wall_seconds: 1800.0
  max_rss_mb: 2048
  stopping_rules:
    forbid_zero_yield_imputation: true    # All 30 moduli executed; no manufactured unobserved zeroes
