inquiry:
  id: "2026-10-kc-metro-education-fractures"
  question: >
    What are the frontline fracture points and disconnects between administrators,
    teachers, and parents across the urban, suburban, and rural school districts of
    metropolitan Kansas City? Specifically, how do working conditions, student behavioral
    escalation, special education/para shortages, school board culture conflicts,
    the Independence 4-day school week, KCPS school closures/tax abatements, and
    Johnson County/Northland workload and scheduling disputes manifest at the campus level?
