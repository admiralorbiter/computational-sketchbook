[project]
name = "signal-observatory"
version = "0.1.0"
description = "A provenance-first public discourse research system for AI-driven social media investigation, monitoring, and discovery."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "orjson>=3.9",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "polars>=1.0",
    "python-dateutil>=2.9",
    "yt-dlp>=2026.8.19",
    "beautifulsoup4>=4.15.0",
    "youtube-transcript-api>=1.2.4",
    "trafilatura>=2.2.0",
    "websockets>=17.1",
    "pyyaml>=6.0.3",
    "curl-cffi>=0.16.3",
    "ddgs>=9.16.0",
]

[project.scripts]
observatory = "observatory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=observatory --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "types-pyyaml>=6.0.12.20260906",
]
